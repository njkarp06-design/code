<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 400px; margin: 60px auto; padding: 0 20px; }
        input { display: block; width: 100%; padding: 8px; margin: 8px 0; font-size: 15px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; font-size: 16px; background: #3b82f6; color: white; border: none; cursor: pointer; margin-top: 10px; }
        button:disabled { background: #aaa; cursor: default; }
        #message { margin-top: 15px; font-weight: bold; }
        a { display: block; margin-top: 15px; text-align: center; }
    </style>
</head>
<body>

    <h2>Login</h2>

    <form id="loginForm">
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button type="submit" id="submitBtn" disabled>Login</button>
    </form>

    <p id="message"></p>
    <a href="register.html">Don't have an account? Register</a>

    <script>
        const inputs = document.querySelectorAll("input")
        const submitBtn = document.getElementById("submitBtn")

        inputs.forEach(input => {
            input.addEventListener("input", function() {
                let allFilled = true
                inputs.forEach(i => {
                    if (i.value === "") allFilled = false
                })
                submitBtn.disabled = !allFilled
            })
        })

        document.getElementById("loginForm").addEventListener("submit", async function(e) {
            e.preventDefault()

            let body = {
                username: document.getElementById("username").value,
                password: document.getElementById("password").value
            }

            let response = await fetch("/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(body)
            })

            let data = await response.json()
            let msg = document.getElementById("message")
            msg.textContent = data.message || data.error
            msg.style.color = response.ok ? "green" : "red"
        })
    </script>
</body>
</html>
