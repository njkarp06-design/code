<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form w JS</title>
</head>
<body>
    <!-- Exercise 1 -->
    <div>
        <form id="myForm1" method="get" action="https://httpbin.org/get">
            Name: <input type="text" name="name" id="name1"><br><br>
            <textarea name="comments" id="comments1" cols="30" rows="10">Comments:</textarea><br><br>
            <input type="submit" value="Send">
        </form>
    </div>

    <!-- Exercise 2 -->
    <div>
        <form id="myForm2" method="post" action="https://httpbin.org/post">
            Name: <input type="text" name="name" id="name2"><br><br>
            <textarea name="comments" id="comments2" cols="30" rows="10">Comments:</textarea><br><br>
            <input type="submit" value="Send">
        </form>
    </div>
</body>
</html>
