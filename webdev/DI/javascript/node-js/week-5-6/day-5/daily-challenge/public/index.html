<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Trivia Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Trivia Quiz</h1>

    <div id="quizSection">
        <p id="progress"></p>
        <p id="question"></p>

        <form id="answerForm">
            <input type="text" id="answerInput" placeholder="Your answer..." autocomplete="off">
            <button type="submit">Submit</button>
        </form>

        <p id="feedback"></p>
    </div>

    <div id="scoreSection" style="display:none">
        <h2 id="finalScore"></h2>
        <button id="restartBtn">Play Again</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
