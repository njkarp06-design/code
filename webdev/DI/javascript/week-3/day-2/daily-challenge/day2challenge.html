<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Solar System</title>
  <style>
    body {
      background-color: black;
      padding: 10px;
    }
    .planet {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      text-align: center;
      padding: 10px;
      position: relative;
      border: 2px solid white;
    }
    .moon {
      position: absolute;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: rgb(237, 237, 237);
      border: 5px solid red;
    }
    .mercury { background-color: #b5b5b5; }
    .venus { background-color: #e8cda0; }
    .earth { background-color: #3b82f6; }
    .mars { background-color: #c1440e; }
    .jupiter { background-color: #c88b3a; }
    .saturn { background-color: #e4d191; }
    .uranus { background-color: #7de8e8; }
    .neptune { background-color: #3f54ba; }
  </style>
</head>
<body>

  <section class="listPlanets"></section>

  <script src="day2challenge.js"></script>
</body>
</html>
